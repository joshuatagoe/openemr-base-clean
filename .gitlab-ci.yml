# GitLab CI — Week 2 eval gate (PRD CR6)
#
# The gate logic deliberately does NOT live in this file. It lives in
# copilot-agent/scripts/eval_gate.py so a grader can run it from a fresh clone
# with no CI, no runner and no API key:
#
#     cd copilot-agent && uv sync && uv run python scripts/eval_gate.py
#
# This file only invokes it. See EVAL_GATE.md at the repo root.
#
# Runner: self-hosted Windows shell executor running as LocalSystem, so
# per-user tooling is not on PATH; hence the explicit uv path below.

default:
  tags: [copilot-w2]
  before_script:
    - $env:PATH = "C:\Users\joshu\.local\bin;$env:PATH"

variables:
  # A fresh clone on every run, never a reused build directory. Found the hard
  # way (pipeline 26894): after *.pdf was marked binary in .gitattributes, the
  # runner's reused checkout still held PDFs written CRLF-converted by an older
  # checkout - git does not rewrite files whose content did not change - so two
  # eval recordings, keyed to the true bytes, looked stale. A fresh clone is
  # also exactly what a grader does, which is the claim EVAL_GATE.md makes.
  GIT_STRATEGY: clone
  # Full history: with a shallow clone, a checkout the runner could not fully delete
  # failed in the "unshallow" repair step (pipeline 31038).
  GIT_DEPTH: "0"

stages:
  - gate

eval-gate:
  stage: gate
  script:
    - cd copilot-agent
    - uv sync
    # No API key is set here on purpose: the gated tier runs entirely offline
    # against StubProvider, so a failure is a change in our logic rather than
    # model sampling noise. Live provider tests are opt-in and not gated.
    - uv run python scripts/eval_gate.py --json ../eval-results.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - eval-results.json

# Patient-dashboard port (dashboard/web SPA + dashboard/bff server). Offline:
# the BFF tests run against a mock OpenEMR on a loopback port, the web tests
# against MSW, so no OpenEMR, network or secret is needed.
dashboard:
  stage: gate
  before_script:
    # Node is a machine-wide install; put it first for the LocalSystem runner.
    - $env:PATH = "C:\Program Files\nodejs;$env:PATH"
  script:
    - cd dashboard
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
    # Modes B/C build (the root Dockerfile runs the same script into the module folder).
    - $env:DASHBOARD_OUT_DIR = "$env:TEMP\dashboard-smart-ci"; npm run build:smart
  after_script:
    # Always remove the installed packages, even when a step failed: the runner's
    # clean-up of the build folder prompts (and fails) on deep, read-only
    # node_modules paths, which broke the next job's checkout (pipeline 31038).
    - cmd /c "if exist dashboard\node_modules rmdir /s /q dashboard\node_modules"
    - cmd /c "if exist dashboard\bff\node_modules rmdir /s /q dashboard\bff\node_modules"
    - cmd /c "if exist dashboard\web\node_modules rmdir /s /q dashboard\web\node_modules"
