[project]
name = "copilot-agent"
version = "0.1.0"
description = "Clinical Co-Pilot agent service: plan-continuity briefings over synthetic OpenEMR context bundles."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115",
    "langfuse>=4.15.4",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: opt-in test that makes one real provider request with synthetic data"]
