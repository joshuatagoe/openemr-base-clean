# Clinical Co-Pilot alerting (ARCHITECTURE.md section 14; copilot-agent/OBSERVABILITY_GUIDE.md Part F).
#
# The four rules also exist as native Langfuse v4 alert rules; this scheduled job is the
# versioned backup: every 5 minutes it evaluates the four rules against the
# Langfuse Metrics API v2 (aggregates only, no trace content) and fails on a
# breach, which notifies through GitHub's workflow-failure notifications and,
# when ALERT_WEBHOOK_URL is set, a Slack-compatible webhook.
#
# Repository secrets: LANGFUSE_BASE_URL, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY,
# optional ALERT_WEBHOOK_URL. GitHub runs scheduled workflows on the default
# branch only and may delay them under load.

name: copilot-alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-alerts
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate Langfuse alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: copilot-agent/ops
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate rules
        env:
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python copilot-agent/ops/langfuse_alerts.py
